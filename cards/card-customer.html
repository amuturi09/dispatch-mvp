<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialpatch Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Print spec: final (trim) 3.5 x 2 in. Full art incl. 1/8" bleed = 3.75 x 2.25 in.
     Keep text inside the safe area (>= 1/8" from trim). */
  @page{ size:3.75in 2.25in; margin:0; }
  *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; margin:0; }
  html,body{ width:3.75in; height:2.25in; }
  body{ font-family:"IBM Plex Sans",system-ui,Segoe UI,Roboto,sans-serif; color:#0F1B2D; }

  .art{ position:relative; width:3.75in; height:2.25in; background:#FFFFFF; overflow:hidden; }
  /* left accent bar runs into the bleed so it stays flush after trimming */
  .bar{ position:absolute; left:0; top:0; bottom:0; width:0.2in; background:linear-gradient(#2D7FF9,#2456C8); }

  /* content kept within the safe area: 0.26in in from every art edge (0.125 bleed + ~0.135 safety) */
  .inner{ position:absolute; left:0.4in; right:0.3in; top:0.3in; bottom:0.3in;
    display:flex; flex-direction:column; justify-content:space-between; }

  .br{ display:flex; align-items:center; justify-content:space-between; }
  .bd{ display:flex; align-items:center; gap:7px; }
  .bd svg{ width:18px; height:18px; display:block; }
  .wm{ font-family:"Archivo"; font-weight:800; font-size:15px; letter-spacing:-.01em; line-height:1; }
  .wm b{ color:#2D7FF9; }
  .tag{ font-family:"Archivo"; font-weight:700; font-size:9px; letter-spacing:.09em; text-transform:uppercase;
    color:#8A5A00; background:#FFF0D1; border:0.75pt solid #F2D79A; border-radius:999px; padding:3px 9px; }

  .hd{ font-family:"Archivo"; font-weight:800; font-size:20px; line-height:1.05; letter-spacing:-.01em; }
  .sb{ font-size:9.5px; line-height:1.3; color:#5B6472; margin-top:3px; max-width:2.8in; }
  .ph{ font-family:"Archivo"; font-weight:900; font-size:27px; letter-spacing:-.02em; color:#2456C8; line-height:1; }
  .ft{ display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
  .svc{ font-size:9px; font-weight:600; }
  .svc .d{ color:#FFB020; font-weight:800; }
  .mini{ font-size:8px; color:#5B6472; margin-top:2px; }
  .site{ font-size:10px; font-weight:700; color:#2456C8; }
</style>
</head>
<body>
  <div class="art">
    <div class="bar"></div>
    <div class="inner">
      <div class="br">
        <div class="bd">
          <svg viewBox="0 0 512 512" fill="none" stroke-linecap="round" aria-hidden="true">
            <path d="M 150 140 A 116 116 0 0 0 150 372" stroke="#2D7FF9" stroke-width="40"/>
            <path d="M 362 140 A 116 116 0 0 1 362 372" stroke="#0F1B2D" stroke-width="40"/>
            <circle cx="256" cy="256" r="46" fill="#FFB020"/>
          </svg>
          <span class="wm">Dial<b>patch</b></span>
        </div>
        <span class="tag">24/7 Emergency</span>
      </div>

      <div>
        <div class="hd">Home emergency?</div>
        <div class="sb">Burst pipe, no heat or AC, or locked out? One call and we dispatch a local, licensed pro &mdash; fast.</div>
      </div>

      <div class="ph">(855)&nbsp;705-8014</div>

      <div class="ft">
        <div>
          <div class="svc">Plumbing <span class="d">&middot;</span> HVAC <span class="d">&middot;</span> Locksmith</div>
          <div class="mini">No cost to call &middot; Save this number</div>
        </div>
        <div class="site">dialpatch.com</div>
      </div>
    </div>
  </div>
</body>
</html>
